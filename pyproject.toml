[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quickmd"
version = "0.1.0"
description = "Local Markdown conversion from Explorer and Finder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["markitdown[pdf,docx,pptx,xlsx]==0.1.9", "magika==0.6.3", "onnxruntime==1.20.1", "numpy==1.26.4", "pandas==2.2.3", "psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "mypy==2.4.0", "pyinstaller==6.22.3", "pip-tools==7.6.2", "python-docx==1.2.0", "reportlab==5.0.1", "pypdf==6.21.2"]

[project.scripts]
quickmd = "quickmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/quickmd"]
